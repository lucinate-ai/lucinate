name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: make build

      - name: Test
        run: make test

      # The suite must also hold under the race detector: a data race in a
      # test makes its own evidence worthless and hides in `go test ./...`.
      - name: Test (race)
        run: go test -race -count=1 -timeout 15m ./...

      - name: Startup smoke
        run: make smoke

      - name: GoReleaser (dry run)
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean --snapshot --skip=publish
